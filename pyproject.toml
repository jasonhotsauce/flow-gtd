[tool.poetry]
name = "flow-gtd"
version = "0.7.4"
description = "Local-first, AI-augmented GTD native macOS app"
authors = ["Flow Team"]
readme = "README.md"
packages = [{include = "flow"}]

[tool.poetry.dependencies]
python = "^3.11"

# LLM Integration (Multi-provider support)
google-genai = "^1.0.0"  # Gemini provider
openai = {version = "^1.0.0", optional = true}  # OpenAI provider
openai-agents = {version = "^0.2.0", optional = true}  # OpenAI Agents SDK runtime
httpx = {version = "^0.27.0", optional = true}  # Ollama provider
tomli = {version = "^2.0.0", python = "<3.11"}  # TOML config (required for Python <3.11, stdlib in 3.11+)

# Web content extraction for resource capture (optional)
trafilatura = {version = "^2.0.0", optional = true}
pypdf = {version = "^5.4.0", optional = true}
chromadb = {version = "^1.0.15", optional = true}
sentence-transformers = {version = "^5.0.0", optional = true}

# Configuration
pydantic-settings = "^2.7.0"

# Apple Ecosystem Sync (macOS only)
pyobjc-framework-EventKit = {version = "^11.0", markers = "sys_platform == 'darwin'"}

[tool.poetry.extras]
openai = ["openai"]
openai-agents = ["openai-agents"]
ollama = ["httpx"]
all-llm = ["openai", "openai-agents", "httpx"]
web = ["trafilatura"]  # For URL content fetching
rag = ["chromadb", "sentence-transformers", "pypdf"]
all = ["openai", "openai-agents", "httpx", "trafilatura", "chromadb", "sentence-transformers", "pypdf"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
