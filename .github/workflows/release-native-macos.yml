name: Release Native macOS App

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-native-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || format('{0}/homebrew-flow', github.repository_owner) }}
  HOMEBREW_CASK_PATH: Casks/flow-gtd.rb

jobs:
  release:
    name: Build, package, and publish
    runs-on: macos-14
    environment:
      name: release
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read version from pyproject.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            expected_with_v="release/v${version}"
            expected_without_v="release/${version}"
            if [[ "${GITHUB_REF_NAME}" != "$expected_with_v" && "${GITHUB_REF_NAME}" != "$expected_without_v" ]]; then
              echo "Release branch must be ${expected_with_v} or ${expected_without_v}; got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) release_arch="arm64" ;;
            x86_64|amd64) release_arch="x86_64" ;;
            *)
              echo "Unsupported release architecture: $arch" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_arch=$release_arch" >> "$GITHUB_OUTPUT"
          echo "asset=Flow-${version}-macos-${release_arch}.zip" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: npm ci

      - name: Run unit tests
        run: poetry run pytest tests/unit -v

      - name: Run native smoke tests
        run: ./scripts/test_native_app.sh

      - name: Build native app
        run: ./scripts/build_native_app.sh

      - name: Package unsigned app
        env:
          FLOW_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          FLOW_RELEASE_ARCH: ${{ steps.version.outputs.release_arch }}
        run: ./scripts/package_native_app.sh

      - name: Render Homebrew Cask
        run: |
          python3 scripts/render_homebrew_cask.py \
            --version "${{ steps.version.outputs.version }}" \
            --github-user "${{ github.repository_owner }}" \
            --github-repo "${{ github.event.repository.name }}" \
            --archive "dist/${{ steps.version.outputs.asset }}" \
            --arch "${{ steps.version.outputs.release_arch }}" \
            --output "$RUNNER_TEMP/flow-gtd.rb"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh release create "$TAG" "dist/$ASSET" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo "Missing HOMEBREW_TAP_DEPLOY_KEY secret." >&2
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$HOME/.ssh/homebrew_tap_deploy_key"
          chmod 600 "$HOME/.ssh/homebrew_tap_deploy_key"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          git config --global core.sshCommand "ssh -i $HOME/.ssh/homebrew_tap_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          tap_dir="$RUNNER_TEMP/homebrew-flow"
          git clone "git@github.com:${HOMEBREW_TAP_REPOSITORY}.git" "$tap_dir"
          mkdir -p "$tap_dir/$(dirname "$HOMEBREW_CASK_PATH")"
          cp "$RUNNER_TEMP/flow-gtd.rb" "$tap_dir/$HOMEBREW_CASK_PATH"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$HOMEBREW_CASK_PATH"
          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi
          git commit -m "Update Flow GTD ${TAG}"
          git push origin HEAD
